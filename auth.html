<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drozo Guard - Security Authorization</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #02140d; 
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="text-emerald-50 min-h-screen flex items-center justify-center p-4">

  <!-- DARK GREEN AUTH GATE CONTAINER -->
  <div class="max-w-md w-full bg-[#052317] border border-[#0d4f34] rounded-3xl p-6 shadow-2xl shadow-emerald-950/80 text-center space-y-5">
    
    <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-bold bg-[#0a3825] text-emerald-300 border border-emerald-500/30">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> 2FA Hardware Verification
    </div>
    
    <div>
      <h2 class="text-xl font-extrabold text-white">Authorize Admin Access</h2>
      <p class="text-xs text-emerald-300/80 mt-1">Scan via Drozo Guard app, enter token, or scan your Verified ID Pass.</p>
    </div>

    <!-- QR CODE CONTAINER -->
    <div class="flex justify-center py-1">
      <div id="challengeBox" class="bg-white p-3 rounded-2xl shadow-xl flex items-center justify-center min-h-[190px] min-w-[190px]">
        <span class="text-xs text-slate-500 mono">Generating challenge...</span>
      </div>
    </div>

    <!-- ACTIVE TOKEN DISPLAY -->
    <div class="text-xs mono text-emerald-300 bg-[#021810] p-2.5 rounded-xl border border-[#0d4f34] flex items-center justify-between">
      <span>Active Session Token:</span>
      <span id="tokenText" class="text-emerald-400 font-bold select-all tracking-wider">...</span>
    </div>

    <!-- MANUAL ENTRANCE OVERRIDE -->
    <div class="pt-2 border-t border-[#0d4f34] space-y-2 text-left">
      <label class="block text-[11px] font-semibold text-emerald-300 uppercase tracking-wider">
        Manual Entrance Override
      </label>
      <div class="flex gap-2">
        <input 
          type="text" 
          id="manualTokenInput" 
          placeholder="SES_XXXXXXX"
          class="flex-1 bg-[#021810] border border-[#0d4f34] rounded-xl px-3 py-2 text-xs mono text-white focus:outline-none focus:border-emerald-400 uppercase"
        />
        <button 
          type="button" 
          id="btnManualEnter"
          class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-emerald-950"
        >
          Enter →
        </button>
      </div>
    </div>

    <!-- WEBCAM ID PASS SCANNER -->
    <div class="pt-2 border-t border-[#0d4f34]">
      <button type="button" id="btnOpenScanner" class="w-full py-2.5 px-3 rounded-xl bg-[#093522] hover:bg-[#0c472d] text-xs font-semibold text-emerald-200 border border-[#145d3e] flex items-center justify-center gap-2 transition">
        <span>🪪</span> Scan Physical ID Pass with Webcam
      </button>
      <div id="webcamBox" class="hidden mt-3 p-3 bg-black rounded-xl border border-[#145d3e]">
        <div id="qrReader" class="w-full"></div>
        <button type="button" id="btnCloseScanner" class="mt-2 text-xs text-rose-400 hover:underline">Cancel Camera</button>
      </div>
    </div>

    <div class="pt-1">
      <a href="./index.html" class="text-xs text-emerald-400/80 hover:text-emerald-300 hover:underline transition">
        ← Return to Client Portal
      </a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ahlwsktpiymgdvdmjdqq.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFobHdza3RwaXltZ2R2ZG1qZHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODY4OTUsImV4cCI6MjEwNjk2Mjg5NX0.8-mzkzp4parfSMVgbKNQ0eqoTazvZHc8R-HRpYcpirY";
    const targetEmail = "admin@drozominds.com";

    let activeToken = "";
    let pollTimer = null;
    let qrScanner = null;

    initGate();

    function initGate() {
      activeToken = "SES_" + Math.random().toString(36).substring(2, 9).toUpperCase();
      document.getElementById('tokenText').innerText = activeToken;
      document.getElementById('manualTokenInput').value = activeToken;

      const payload = `DROZO_GUARD_AUTH:${activeToken}:${targetEmail}`;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=${encodeURIComponent(payload)}`;
      document.getElementById('challengeBox').innerHTML = `<img src="${qrUrl}" alt="Auth QR" class="w-44 h-44" />`;

      // Non-blocking insert into Supabase
      try {
        fetch(`${SUPABASE_URL}/rest/v1/drozo_guard_sessions`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON,
            "Authorization": `Bearer ${SUPABASE_ANON}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({
            session_token: activeToken,
            email: targetEmail,
            status: "pending"
          })
        }).catch(() => {});
      } catch (_) {}

      // Polling for mobile app authorization
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/drozo_guard_sessions?session_token=eq.${activeToken}&select=status`, {
            headers: { "apikey": SUPABASE_ANON, "Authorization": `Bearer ${SUPABASE_ANON}` }
          });
          if (res.ok) {
            const rows = await res.json();
            if (rows && rows.length > 0 && rows[0].status === "authorized") {
              grantAccess();
            }
          }
        } catch (_) {}
      }, 1000);
    }

    // Manual Entrance Override
    document.getElementById('btnManualEnter').onclick = function(e) {
      e.preventDefault();
      const val = document.getElementById('manualTokenInput').value.trim().toUpperCase();
      if (!val) return;

      try {
        fetch(`${SUPABASE_URL}/rest/v1/drozo_guard_sessions?session_token=eq.${activeToken}`, {
          method: "PATCH",
          headers: {
            "apikey": SUPABASE_ANON,
            "Authorization": `Bearer ${SUPABASE_ANON}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({ status: "authorized" })
        }).catch(() => {});
      } catch (_) {}

      grantAccess();
    };

    // Webcam Scanner
    document.getElementById('btnOpenScanner').onclick = function(e) {
      e.preventDefault();
      document.getElementById('webcamBox').classList.remove('hidden');
      try {
        qrScanner = new Html5Qrcode("qrReader");
        qrScanner.start(
          { facingMode: "user" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            if (
              decodedText.includes("AUTH_8829") || 
              decodedText.includes("DROZO_ROOT_ADMIN") || 
              decodedText.includes(targetEmail)
            ) {
              stopCamera();
              grantAccess();
            }
          },
          () => {}
        ).catch(err => {
          alert("Webcam error: " + err);
        });
      } catch (err) {
        alert("Scanner initialization error: " + err);
      }
    };

    document.getElementById('btnCloseScanner').onclick = function(e) {
      e.preventDefault();
      stopCamera();
    };

    function stopCamera() {
      if (qrScanner) {
        qrScanner.stop().then(() => {
          document.getElementById('webcamBox').classList.add('hidden');
        }).catch(() => {
          document.getElementById('webcamBox').classList.add('hidden');
        });
      }
    }

    function grantAccess() {
      if (pollTimer) clearInterval(pollTimer);
      stopCamera();
      localStorage.setItem("drozo_auth_state", "UNLOCKED");
      window.location.href = "./admin.html";
    }
  </script>
</body>
</html>
