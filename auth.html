<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drozo Guard - Sign In Request</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #0b1118;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .map-grid {
      background-color: #121c26;
      background-image: 
        linear-gradient(rgba(30, 58, 86, 0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 58, 86, 0.3) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Mobile Guard Chassis -->
  <div class="w-full max-w-sm rounded-[36px] bg-[#101923] border border-[#1e2d3d] shadow-[0_20px_50px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col justify-between min-h-[620px]">
    
    <!-- Top Bar -->
    <div class="px-6 pt-5 pb-3 flex items-center justify-between border-b border-[#182635]">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-xs">
          🛡️
        </div>
        <span class="text-xs font-black tracking-widest text-slate-300 uppercase">DROZO GUARD</span>
      </div>
      <span class="text-[10px] mono text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded-full border border-emerald-500/30 animate-pulse">
        LIVE LINK
      </span>
    </div>

    <!-- Middle: Interactive Map & Telemetry Box -->
    <div class="p-5 space-y-4 flex-1 flex flex-col justify-center">

      <!-- Map View with Pin (Styled after Steam Guard Map) -->
      <div class="relative w-full h-44 rounded-2xl overflow-hidden border border-[#223547] map-grid flex items-center justify-center shadow-inner">
        <!-- Map Water & Roads Visual Accents -->
        <div class="absolute inset-0 bg-gradient-to-tr from-[#0d1620] via-transparent to-[#132230] opacity-80"></div>
        <div class="absolute w-32 h-16 bg-[#1a2f44]/40 rounded-full blur-xl"></div>
        
        <!-- Location Pin Target -->
        <div class="relative z-10 flex flex-col items-center">
          <div class="relative flex items-center justify-center">
            <span class="w-8 h-8 rounded-full bg-emerald-500/20 animate-ping absolute"></span>
            <div class="w-7 h-7 rounded-full bg-emerald-500 text-slate-950 font-black text-xs flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.8)] border-2 border-white">
              📍
            </div>
          </div>
          <div class="mt-2 bg-[#091118]/90 backdrop-blur-md px-3 py-1 rounded-full border border-[#1e3247] shadow-lg text-center">
            <span class="text-xs font-bold text-white tracking-wide" id="guardCity">Dubai</span>
            <span class="text-[10px] text-slate-400 block" id="guardCountry">United Arab Emirates</span>
          </div>
        </div>
        
        <div class="absolute bottom-2 left-3 text-[9px] text-slate-500 uppercase tracking-widest mono font-bold">
          DROZO MAPS
        </div>
      </div>

      <!-- Sign In Request Details -->
      <div class="bg-[#0b131c] border border-[#1b2a3a] rounded-2xl p-4 space-y-3 shadow-md">
        <div class="text-center">
          <div class="text-[11px] text-slate-400 font-medium">New sign in request for</div>
          <div class="text-sm font-extrabold text-white mt-0.5" id="targetAccountName">Water_Chugger/Owner</div>
          <div class="text-[10px] text-emerald-400 mono mt-0.5" id="targetAccountEmail">admin@drozominds.com</div>
        </div>

        <div class="border-t border-[#182635] pt-3 grid grid-cols-2 gap-2 text-center text-xs">
          <div class="bg-[#0f1924] p-2 rounded-xl border border-[#1d2d3e]">
            <div class="text-[10px] text-slate-400 uppercase font-semibold">Client</div>
            <div class="font-bold text-slate-200 mt-0.5 truncate" id="guardClientInfo">Safari • macOS</div>
          </div>
          <div class="bg-[#0f1924] p-2 rounded-xl border border-[#1d2d3e]">
            <div class="text-[10px] text-slate-400 uppercase font-semibold">Session ID</div>
            <div class="font-bold text-emerald-400 mono mt-0.5 truncate" id="guardSessionToken">SES_ACTIVE</div>
          </div>
        </div>

        <!-- Trust Checkbox -->
        <label class="flex items-center gap-2 pt-1 text-left cursor-pointer select-none">
          <input type="checkbox" checked class="w-4 h-4 rounded text-emerald-500 bg-[#162330] border-slate-700 focus:ring-0 focus:outline-none" />
          <span class="text-[11px] text-slate-300">Remember this trusted device</span>
        </label>
      </div>

    </div>

    <!-- Action Buttons: Approve vs Deny (Steam Guard Style) -->
    <div class="p-5 pt-0 grid grid-cols-2 gap-3">
      <button 
        onclick="authorizeChallenge(true)" 
        id="btnApprove" 
        class="py-3.5 px-4 rounded-2xl font-bold text-sm bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white shadow-[0_4px_20px_rgba(14,165,233,0.35)] transition transform active:scale-95 flex items-center justify-center gap-2"
      >
        <span>✓</span> Approve
      </button>

      <button 
        onclick="authorizeChallenge(false)" 
        id="btnDeny" 
        class="py-3.5 px-4 rounded-2xl font-bold text-sm bg-[#1f2937] hover:bg-[#374151] border border-slate-700 text-slate-300 transition transform active:scale-95 flex items-center justify-center gap-2"
      >
        <span>✕</span> Deny
      </button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ahlwsktpiymgdvdmjdqq.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFobHdza3RwaXltZ2R2ZG1qZHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODY4OTUsImV4cCI6MjEwNjk2Mjg5NX0.8-mzkzp4parfSMVgbKNQ0eqoTazvZHc8R-HRpYcpirY";

    // Read session from query params or current pending session
    const urlParams = new URLSearchParams(window.location.search);
    const sessionToken = urlParams.get('token') || localStorage.getItem("drozo_current_challenge_token") || "SES_8829";
    const userEmail = urlParams.get('email') || localStorage.getItem("drozo_current_challenge_email") || "admin@drozominds.com";

    document.getElementById('guardSessionToken').innerText = sessionToken;
    document.getElementById('targetAccountEmail').innerText = userEmail;
    if (userEmail === "gamerkids1109@gmail.com") {
      document.getElementById('targetAccountName').innerText = "Drozo YT (Coordinator)";
    } else if (userEmail === "admin@drozominds.com") {
      document.getElementById('targetAccountName').innerText = "Water_Chugger/Owner";
    } else {
      document.getElementById('targetAccountName').innerText = userEmail.split('@')[0];
    }

    async function authorizeChallenge(approved) {
      const btnA = document.getElementById('btnApprove');
      const btnD = document.getElementById('btnDeny');
      btnA.disabled = true;
      btnD.disabled = true;

      const newStatus = approved ? "authorized" : "denied";

      // 1. Update Supabase
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/drozo_guard_sessions?session_token=eq.${sessionToken}`, {
          method: "PATCH",
          headers: {
            "apikey": SUPABASE_ANON,
            "Authorization": `Bearer ${SUPABASE_ANON}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({ status: newStatus })
        });
      } catch (_) {}

      // 2. Local fallback sync
      localStorage.setItem("drozo_challenge_result_" + sessionToken, newStatus);

      if (approved) {
        localStorage.setItem("drozo_auth_state", "UNLOCKED");
        localStorage.setItem("drozo_active_session", userEmail);
        btnA.innerText = "Approved ✓";
        setTimeout(() => {
          if (userEmail === "admin@drozominds.com" || userEmail === "gamerkids1109@gmail.com") {
            window.location.href = "./admin.html";
          } else {
            window.location.href = "./index.html";
          }
        }, 600);
      } else {
        btnD.innerText = "Denied ✕";
        alert("Sign in request denied and token invalidated.");
        window.location.href = "./index.html";
      }
    }
  </script>
</body>
</html>
