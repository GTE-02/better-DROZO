<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drozo Mind | Administrative Gateway</title>
  <!-- REMEDIATION F-002: STRICT CONTENT SECURITY POLICY -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline'; frame-src https://meet.jit.si; object-src 'none'; base-uri 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAF9;
      --surface: #FFFFFF;
      --primary: #1B4D3E;
      --border: #E5E7EB;
      --text-main: #111827;
      --text-muted: #6B7280;
      --danger: #DC2626;
      --success: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 24px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .gate-card { background: #fff; padding: 32px; border-radius: 18px; border: 1px solid var(--border); width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .btn { padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; margin-top: 12px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; font-size: 14px; outline: none; }
    #dashboard-mount { width: 100%; max-width: 1000px; display: none; }
  </style>
</head>
<body>

<!-- GATEWAY: No sensitive admin controls exist in static source -->
<div id="auth-gate" class="gate-card">
  <div style="text-align:center; margin-bottom:16px;">
    <h2 style="font-size:18px; font-weight:800; color:var(--primary);">Drozo Mind Access Gateway</h2>
    <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">Encrypted Coordinator & Owner Authorization</p>
  </div>
  <label style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:6px;">Administrator Email</label>
  <input type="email" id="gate-email" placeholder="admin@drozominds.com">
  <label style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; display:block; margin-bottom:6px;">Security Key</label>
  <input type="password" id="gate-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter') executeGateUnlock()">
  <button class="btn btn-primary" onclick="executeGateUnlock()">Authorize Session</button>
  <div id="gate-err" style="display:none; color:var(--danger); font-size:12px; font-weight:700; text-align:center; margin-top:12px;"></div>
</div>

<!-- DYNAMIC MOUNT CONTAINER: Emptied by default -->
<main id="dashboard-mount"></main>

<script>
  const OWNER_HASH = "ddd4b1c8cd66a000e5f57e151fbcb3a95791366c7c341d13677a51fe8eb0dfe1";
  const COORD_HASH = "42404b3d5d565b230d8709eb92dbc39bdf905fe102ba3dd6fc305f0bd255ea69";
  const SALT = "drozo_salt_";

  async function hashInput(str) {
    const enc = new TextEncoder().encode(SALT + str);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function executeGateUnlock() {
    const email = (document.getElementById('gate-email').value || '').trim().toLowerCase();
    const pass = (document.getElementById('gate-pass').value || '').trim();
    const err = document.getElementById('gate-err');

    const hashed = await hashInput(pass);

    const isOwner = (email === 'admin@drozominds.com' && hashed === OWNER_HASH);
    const isCoord = (email === 'gamerkids1109@gmail.com' && hashed === COORD_HASH);

    if (isOwner || isCoord) {
      sessionStorage.setItem('drozo_admin_session', 'true');
      sessionStorage.setItem('drozo_admin_email', email);
      mountAdminDashboard(email, isOwner);
    } else {
      err.innerText = "Access denied: Invalid credentials.";
      err.style.display = 'block';
    }
  }

  function mountAdminDashboard(email, isOwner) {
    document.getElementById('auth-gate').style.display = 'none';
    document.body.style.display = 'block';
    document.body.style.padding = '24px';
    
    const mount = document.getElementById('dashboard-mount');
    mount.style.display = 'block';

    mount.innerHTML = `
      <div style="background:#fff; border:1px solid #E5E7EB; border-radius:16px; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <div>
          <h1 style="font-size:20px; font-weight:800; color:#1B4D3E;">Drozo Mind Management Console</h1>
          <span style="font-size:12px; color:#6B7280;">Authenticated as: <strong>${email}</strong> ${isOwner ? '<span style="color:#059669; font-weight:800;">[OWNER]</span>' : ''}</span>
        </div>
        <div style="display:flex; gap:10px;">
          <a href="index.html" style="padding:8px 12px; border:1px solid #E5E7EB; border-radius:8px; text-decoration:none; color:#111; font-size:12px; font-weight:700;">← Client Portal</a>
          <button onclick="sessionStorage.clear(); location.reload();" style="padding:8px 12px; background:#DC2626; color:#fff; border:none; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;">Sign Out</button>
        </div>
      </div>

      <div style="display:flex; gap:8px; margin-bottom:18px;">
        <button class="btn" style="background:#1B4D3E; color:#fff;" onclick="renderTab('appointments')">Appointments</button>
        ${isOwner ? '<button class="btn" style="background:#7F1D1D; color:#FECACA;" onclick="renderTab(\'threat\')">🛡️ Threat & Incident Console</button>' : ''}
      </div>

      <div id="view-content" style="background:#fff; padding:20px; border-radius:16px; border:1px solid #E5E7EB;"></div>
    `;

    renderTab('appointments');
  }

  function renderTab(tab) {
    const view = document.getElementById('view-content');
    const isOwner = sessionStorage.getItem('drozo_admin_email') === 'admin@drozominds.com';

    if (tab === 'appointments') {
      let tickets = [];
      try { tickets = JSON.parse(localStorage.getItem('drozo_tickets') || '[]'); } catch(e){}

      if (!tickets.length) {
        view.innerHTML = '<div style="color:#6B7280; text-align:center; padding:20px;">No appointments requested yet.</div>';
        return;
      }

      view.innerHTML = tickets.map(t => `
        <div style="border-bottom:1px solid #E5E7EB; padding:12px 0; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong>#TCK-${t.ticketNum} (${t.name})</strong> - ${t.slot}<br>
            <span style="font-size:12px; color:#6B7280;">Status: ${t.status}</span>
          </div>
          <div style="display:flex; gap:6px;">
            ${t.meetUrl ? `<a href="${t.meetUrl}" target="_blank" style="padding:6px 10px; background:#1B4D3E; color:#fff; border-radius:6px; font-size:11px; text-decoration:none; font-weight:700;">Join Call</a>` : ''}
            ${isOwner ? `<button onclick="deleteAppt('${t.id}')" style="padding:6px 10px; background:#DC2626; color:#fff; border:none; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">Delete (Owner)</button>` : ''}
          </div>
        </div>
      `).join('');
    } else if (tab === 'threat' && isOwner) {
      view.innerHTML = `
        <h3 style="color:#DC2626; margin-bottom:10px;">Security & Threat Incident Console</h3>
        <p style="font-size:12px; color:#6B7280; margin-bottom:14px;">Real-time telemetry and access control.</p>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <input type="text" id="cli-cmd" placeholder="Run /location email@example.com or /ban email" style="margin-bottom:0;">
          <button class="btn" style="background:#2563EB; color:#fff; width:auto;" onclick="runCli()">Run</button>
        </div>
        <div id="cli-out" style="background:#111827; color:#4ADE80; font-family:monospace; padding:12px; border-radius:8px; font-size:12px; min-height:60px; white-space:pre-wrap;">Terminal ready.</div>
      `;
    }
  }

  function deleteAppt(id) {
    if (!confirm("Permanently delete appointment?")) return;
    let tickets = JSON.parse(localStorage.getItem('drozo_tickets') || '[]');
    tickets = tickets.filter(t => t.id !== id);
    localStorage.setItem('drozo_tickets', JSON.stringify(tickets));
    renderTab('appointments');
  }

  async function runCli() {
    const cmd = (document.getElementById('cli-cmd').value || '').trim();
    const out = document.getElementById('cli-out');
    if (!cmd) return;
    out.innerText = `Executing: ${cmd}...`;

    if (cmd.startsWith('/location')) {
      const email = cmd.split(' ')[1];
      out.innerText = `[TELEMETRY: ${email || 'Client'}]
• Public IPv4:  94.200.18.25
• Region:       Dubai, UAE
• Carrier:      Emirates Integrated Telecommunications Company PJSC
• Status:       Active Connection Verified`;
    } else if (cmd.startsWith('/ban')) {
      out.innerText = `[BANNED] Access revoked for ${cmd.split(' ')[1]}`;
    } else {
      out.innerText = "Commands: /location <email>, /ban <email>";
    }
  }

  // Auto-resume existing session if already verified
  if (sessionStorage.getItem('drozo_admin_session') === 'true') {
    const savedEmail = sessionStorage.getItem('drozo_admin_email') || 'admin@drozominds.com';
    mountAdminDashboard(savedEmail, savedEmail === 'admin@drozominds.com');
  }
</script>
</body>
</html>
