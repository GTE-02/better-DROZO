<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drozo Admin — Clinical & Platform Operations</title>
  <meta name="description" content="Clinical administration and operations dashboard for Drozo Therapy. Monitor sessions, manage licensed therapists, track billing, and oversee user care.">

  <!-- Google Fonts: Plus Jakarta Sans (Headings) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // --- 1. NUMBER COUNTING ANIMATION ON LOAD ---
    function animateCounters() {
      const counters = document.querySelectorAll('.stat-counter');
      counters.forEach(counter => {
        const target = parseInt(counter.getAttribute('data-target') || counter.textContent || '0', 10);
        const prefix = counter.getAttribute('data-prefix') || '';
        const duration = 1000; // ms
        const startTime = performance.now();

        function updateNumber(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeProgress = 1 - Math.pow(1 - progress, 3);
          const currentVal = Math.floor(easeProgress * target);

          counter.textContent = prefix + currentVal.toLocaleString();

          if (progress < 1) {
            requestAnimationFrame(updateNumber);
          } else {
            counter.textContent = prefix + target.toLocaleString();
          }
        }

        requestAnimationFrame(updateNumber);
      });
    }

    // --- 2. SIDEBAR COLLAPSE TOGGLE ---
    function toggleSidebarCollapse() {
      document.body.classList.toggle('sidebar-collapsed');
      const isCollapsed = document.body.classList.contains('sidebar-collapsed');
      localStorage.setItem('drozo_sidebar_collapsed', isCollapsed ? 'true' : 'false');
    }

    if (localStorage.getItem('drozo_sidebar_collapsed') === 'true') {
      document.body.classList.add('sidebar-collapsed');
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('mobile-backdrop');
      const isClosed = sidebar.classList.contains('-translate-x-full');

      if (isClosed) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    // --- 3. DROPDOWNS (Notifications & Avatar) ---
    function toggleNotificationDropdown(e) {
      if (e) e.stopPropagation();
      const dd = document.getElementById('notification-dropdown');
      const avatarDd = document.getElementById('avatar-dropdown');
      if (avatarDd) avatarDd.classList.add('hidden');
      if (dd) dd.classList.toggle('hidden');
    }

    function toggleAvatarDropdown(e) {
      if (e) e.stopPropagation();
      const dd = document.getElementById('avatar-dropdown');
      const notifDd = document.getElementById('notification-dropdown');
      if (notifDd) notifDd.classList.add('hidden');
      if (dd) dd.classList.toggle('hidden');
    }

    document.addEventListener('click', function(e) {
      const notifDd = document.getElementById('notification-dropdown');
      const avatarDd = document.getElementById('avatar-dropdown');
      if (notifDd && !notifDd.contains(e.target) && !e.target.closest('#bell-btn')) {
        notifDd.classList.add('hidden');
      }
      if (avatarDd && !avatarDd.contains(e.target) && !e.target.closest('#avatar-btn')) {
        avatarDd.classList.add('hidden');
      }
    });

    function clearNotifications() {
      const badge = document.getElementById('bell-badge');
      if (badge) badge.style.display = 'none';
      const unread = document.getElementById('bell-unread-count');
      if (unread) unread.textContent = '0 Unread';
      showToast('All notifications marked as read');
      const dd = document.getElementById('notification-dropdown');
      if (dd) dd.classList.add('hidden');
    }

    // --- 4. TABLE SORTING FUNCTIONALITY (Vanilla JS) ---
    let currentSortCol = -1;
    let sortAsc = true;

    function sortTable(columnIndex, type) {
      const table = document.getElementById('clinical-table');
      const tbody = document.getElementById('table-body');
      if (!table || !tbody) return;
      if (document.getElementById('empty-table-placeholder')) return; // No items to sort

      const rows = Array.from(tbody.querySelectorAll('tr')).filter(r => r.id !== 'empty-table-placeholder');
      if (!rows.length) return;

      if (currentSortCol === columnIndex) {
        sortAsc = !sortAsc;
      } else {
        currentSortCol = columnIndex;
        sortAsc = true;
      }

      const headers = table.querySelectorAll('th');
      headers.forEach((th, idx) => {
        const icon = th.querySelector('.sort-icon');
        if (icon) {
          if (idx === columnIndex) {
            icon.textContent = sortAsc ? '▲' : '▼';
            icon.classList.add('text-primary');
            icon.classList.remove('text-charcoal-muted/60');
          } else {
            icon.textContent = '↕';
            icon.classList.remove('text-primary');
            icon.classList.add('text-charcoal-muted/60');
          }
        }
      });

      rows.sort((rowA, rowB) => {
        const cellA = rowA.children[columnIndex];
        const cellB = rowB.children[columnIndex];
        if (!cellA || !cellB) return 0;

        let valA, valB;
        if (type === 'number') {
          valA = parseFloat(cellA.getAttribute('data-minutes') || cellA.innerText.replace(/[^0-9.-]+/g, '')) || 0;
          valB = parseFloat(cellB.getAttribute('data-minutes') || cellB.innerText.replace(/[^0-9.-]+/g, '')) || 0;
        } else if (type === 'date') {
          valA = parseInt(cellA.getAttribute('data-timestamp') || '0', 10);
          valB = parseInt(cellB.getAttribute('data-timestamp') || '0', 10);
        } else {
          valA = cellA.innerText.trim().toLowerCase();
          valB = cellB.innerText.trim().toLowerCase();
        }

        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      rows.forEach(row => tbody.appendChild(row));
      showToast(`Sorted by column (${sortAsc ? 'Ascending' : 'Descending'})`);
    }

    // --- 5. TABLE STATUS FILTER (All, Completed, Scheduled, Cancelled) ---
    function filterTableByStatus(status) {
      const rows = document.querySelectorAll('#table-body tr');
      const tabs = document.querySelectorAll('.filter-tab');

      tabs.forEach(tab => {
        tab.classList.remove('bg-primary', 'text-white', 'font-semibold', 'shadow-sm');
        tab.classList.add('text-charcoal-muted');
      });

      const activeTabId = status === 'all' ? 'tab-all' : `tab-${status.toLowerCase()}`;
      const activeBtn = document.getElementById(activeTabId);
      if (activeBtn) {
        activeBtn.classList.add('bg-primary', 'text-white', 'font-semibold', 'shadow-sm');
        activeBtn.classList.remove('text-charcoal-muted');
      }

      let visibleCount = 0;
      rows.forEach(row => {
        if (row.id === 'empty-table-placeholder') return;
        const cell = row.children[5];
        if (!cell) return;
        const statusText = cell.innerText.trim();
        if (status === 'all' || statusText.toLowerCase().includes(status.toLowerCase())) {
          row.style.display = '';
          visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });

      const pagCount = document.getElementById('pag-showing-count');
      if (pagCount) pagCount.textContent = visibleCount;
    }

    // --- 6. LIVE TABLE SEARCH INPUT FILTER ---
    function filterTableSearch(query) {
      const term = query.toLowerCase();
      const rows = document.querySelectorAll('#table-body tr');
      let count = 0;

      rows.forEach(row => {
        if (row.id === 'empty-table-placeholder') return;
        const text = row.innerText.toLowerCase();
        if (text.includes(term)) {
          row.style.display = '';
          count++;
        } else {
          row.style.display = 'none';
        }
      });

      const pagCount = document.getElementById('pag-showing-count');
      if (pagCount) pagCount.textContent = count;
    }

    // --- 7. TOPBAR GLOBAL SEARCH ---
    function highlightSearch() {
      const input = document.getElementById('topbar-search');
      if (input) input.classList.add('ring-2', 'ring-primary');
    }

    function handleGlobalSearch(e) {
      if (e.key === 'Enter') {
        const query = e.target.value.trim();
        if (query) {
          showToast(`Searching Drozo database for "${query}"...`);
          filterTableSearch(query);
          document.getElementById('sessions-table').scrollIntoView({ behavior: 'smooth' });
        }
      }
    }

    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        const searchInput = document.getElementById('topbar-search');
        if (searchInput) searchInput.focus();
      }
    });

    // --- 8. MODALS ---
    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    function openAddTherapistModal() { openModal('add-therapist-modal'); }
    function openCreateSessionModal() { openModal('create-session-modal'); }
    function openBroadcastModal() { openModal('broadcast-modal'); }
    function openSettingsModal() { showToast('Opened System & Clinical Operations Preferences'); }

    function openProfileModal() {
      const name = (meAdmin && meAdmin.display_name) || (meAdmin && meAdmin.email) || 'Lead Administrator';
      showToast(`${name} — Operations Clearance Profile`);
    }

    function showSessionDetail(client, therapist, datetime, status) {
      const elC = document.getElementById('detail-client-name');
      const elT = document.getElementById('detail-therapist-name');
      const elD = document.getElementById('detail-datetime');
      const elS = document.getElementById('detail-status');
      if (elC) elC.innerText = client || '—';
      if (elT) elT.innerText = therapist || '—';
      if (elD) elD.innerText = datetime || '—';
      if (elS) elS.innerText = status || '—';
      openModal('session-detail-modal');
    }

    function handleAddTherapist(e) {
      e.preventDefault();
      closeModal('add-therapist-modal');
      showToast('✅ Clinician registration submitted to verification queue');
    }

    function handleBroadcast(e) {
      e.preventDefault();
      closeModal('broadcast-modal');
      showToast('📣 Urgent bulletin broadcast to network clinicians');
    }

    function triggerDataExport() {
      showToast('📥 Preparing encrypted HIPAA-compliant CSV export...');
      setTimeout(() => {
        showToast('✅ Drozo-Telehealth-Records-Nov2026.csv downloaded');
      }, 900);
    }

    function filterTimeRange(range) {
      showToast(`Refreshed metrics for: ${range.toUpperCase()}`);
      animateCounters();
    }

    function changePage(direction) {
      showToast('Navigated to session table page');
    }

    function goToPage(page) {
      showToast(`Loaded session table page ${page}`);
    }

    function confirmLogout() {
      if (confirm('Are you sure you want to exit your clinical operations console?')) {
        const SUPABASE_URL = (window.DROZO_CONFIG || {}).url;
        const SUPABASE_ANON = (window.DROZO_CONFIG || {}).anon;
        if (SUPABASE_URL && SUPABASE_ANON && typeof supabase !== 'undefined') {
          const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
          sb.auth.signOut().then(() => {
            localStorage.removeItem('drozo_active_session');
            window.location.href = 'index.html';
          });
        } else {
          localStorage.removeItem('drozo_active_session');
          window.location.href = 'index.html';
        }
      }
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto bg-charcoal text-white text-xs px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 transform translate-y-3 opacity-0 transition-all duration-300 border border-sand-dark/20';
      toast.innerHTML = `
        <div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center shrink-0">
          <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
        </div>
        <span class="font-medium">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-3', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('translate-y-3', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // --- 9. SUPABASE REAL-TIME DATA SYNC ---
    let sbAdmin = null;
    let meAdmin = null;
    let allRegisteredUsers = [];

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    async function initSupabaseAdmin() {
      const SUPABASE_URL = (window.DROZO_CONFIG || {}).url;
      const SUPABASE_ANON = (window.DROZO_CONFIG || {}).anon;
      if (!SUPABASE_URL || !SUPABASE_ANON || typeof supabase === 'undefined') {
        console.warn('Supabase configuration missing');
        return;
      }

      sbAdmin = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
        auth: { persistSession: true, autoRefreshToken: true }
      });

      // Retrieve current session; if none, allow fallback administrator session
      let user = null;
      try {
        const { data } = await sbAdmin.auth.getSession();
        if (data && data.session && data.session.user) {
          user = data.session.user;
        }
      } catch (_) {}

      if (!user) {
        const activeLocal = localStorage.getItem('drozo_active_session');
        if (activeLocal) {
          user = {
            id: 'local-' + activeLocal.replace(/[^a-zA-Z0-9]/g, ''),
            email: activeLocal,
            user_metadata: { full_name: activeLocal.split('@')[0] }
          };
        } else {
          user = {
            id: 'admin-guest',
            email: 'admin@drozo.internal',
            user_metadata: { full_name: 'Lead Operations Administrator' }
          };
        }
      }

      const meta = user.user_metadata || {};
      const displayName = meta.custom_claims?.global_name 
        || meta.full_name 
        || meta.user_name 
        || meta.name 
        || meta.preferred_username 
        || (user.email ? user.email.split('@')[0] : 'Administrator');
      const avatarUrl = meta.avatar_url;
      const provider = user.app_metadata?.provider || 'email';

      // Update Header Profile with real provider credentials
      const nameHeader = document.getElementById('admin-name-header');
      if (nameHeader) nameHeader.textContent = displayName;

      const dropdownName = document.getElementById('admin-dropdown-name');
      if (dropdownName) dropdownName.textContent = displayName;

      const dropdownEmail = document.getElementById('admin-dropdown-email');
      if (dropdownEmail) dropdownEmail.textContent = user.email || 'admin@drozo.internal';

      const avatarContainer = document.getElementById('admin-avatar-container');
      if (avatarContainer) {
        if (avatarUrl) {
          avatarContainer.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full" alt="${escapeHtml(displayName)}">`;
        } else {
          avatarContainer.textContent = (displayName.slice(0, 2)).toUpperCase();
        }
      }

      // Check or assign role
      let profileRole = 'admin';
      try {
        if (user.id && !user.id.startsWith('admin-')) {
          const { data: profile } = await sbAdmin.from('profiles').select('id,email,role').eq('id', user.id).maybeSingle();
          if (profile && profile.role) {
            profileRole = profile.role;
          }
        }
      } catch (_) {}

      meAdmin = {
        id: user.id,
        email: user.email,
        role: profileRole,
        display_name: displayName,
        avatar_url: avatarUrl,
        provider: provider
      };

      if (user.id) {
        localStorage.setItem('drozo_meta_' + user.id, JSON.stringify({
          display_name: displayName,
          avatar_url: avatarUrl,
          provider: provider
        }));
      }

      // Update badge
      const roleHeader = document.getElementById('admin-role-header');
      if (roleHeader) roleHeader.textContent = profileRole.toUpperCase() + ' CLEARANCE';

      const dropdownRole = document.getElementById('admin-dropdown-role');
      if (dropdownRole) dropdownRole.textContent = profileRole === 'admin' ? 'Super Administrator' : 'Clinical Operations';

      // Start live real-time sync
      updateAdminStats();
      loadLiveAdminQueue();
      loadRegisteredUsers();

      // Poll every 3 seconds for continuous live updates
      setInterval(() => {
        updateAdminStats();
        loadLiveAdminQueue();
        loadRegisteredUsers();
      }, 3000);
    }

    async function updateAdminStats() {
      if (!sbAdmin) return;
      try {
        // 1. Total users
        const { count: userCount } = await sbAdmin.from('profiles').select('*', { count: 'exact', head: true });
        const cUsers = userCount || 0;
        const elUsers = document.getElementById('stat-total-users');
        if (elUsers) {
          elUsers.textContent = cUsers;
          elUsers.setAttribute('data-target', cUsers);
        }
        const subUsers = document.getElementById('stat-users-subtitle');
        if (subUsers) subUsers.textContent = `${cUsers} verified account${cUsers === 1 ? '' : 's'}`;
        const badgeSignups = document.getElementById('user-signup-badge');
        if (badgeSignups) badgeSignups.textContent = `${cUsers} Registered`;
        const userTableCount = document.getElementById('user-table-count');
        if (userTableCount) userTableCount.textContent = `${cUsers} Account${cUsers === 1 ? '' : 's'}`;
        const sideUsers = document.getElementById('sidebar-users-badge');
        if (sideUsers) sideUsers.textContent = cUsers;

        // 2. Active Clinicians
        const { count: staffCount } = await sbAdmin.from('profiles').select('*', { count: 'exact', head: true }).in('role', ['therapist', 'coordinator', 'admin']);
        const cStaff = staffCount || 0;
        const elStaff = document.getElementById('stat-therapists');
        if (elStaff) {
          elStaff.textContent = cStaff;
          elStaff.setAttribute('data-target', cStaff);
        }
        const subStaff = document.getElementById('stat-therapists-subtitle');
        if (subStaff) subStaff.textContent = `${cStaff} assigned staff member${cStaff === 1 ? '' : 's'}`;
        const badgeStaff = document.getElementById('therapist-count-badge');
        if (badgeStaff) badgeStaff.textContent = `${cStaff} Verified`;
        const sideStaff = document.getElementById('sidebar-therapists-badge');
        if (sideStaff) sideStaff.textContent = cStaff;

        // 3. Total Sessions
        const { count: sessionCount } = await sbAdmin.from('appointments').select('*', { count: 'exact', head: true });
        const cSessions = sessionCount || 0;
        const elSessions = document.getElementById('stat-sessions');
        if (elSessions) {
          elSessions.textContent = cSessions;
          elSessions.setAttribute('data-target', cSessions);
        }
        const subSessions = document.getElementById('stat-sessions-subtitle');
        if (subSessions) subSessions.textContent = `${cSessions} scheduled appointment${cSessions === 1 ? '' : 's'}`;
        const modTotal = document.getElementById('mod-total-sessions');
        if (modTotal) modTotal.textContent = cSessions;

        // 4. Live Queue
        const { count: queueCount } = await sbAdmin.from('appointments').select('*', { count: 'exact', head: true }).in('status', ['CONFIRMED', 'PENDING']);
        const cQueue = queueCount || 0;
        const elQueue = document.getElementById('stat-live-queue');
        if (elQueue) {
          elQueue.textContent = cQueue;
          elQueue.setAttribute('data-target', cQueue);
        }
        const subQueue = document.getElementById('stat-queue-subtitle');
        if (subQueue) subQueue.textContent = `${cQueue} active in queue`;
        const modQueue = document.getElementById('mod-active-queue');
        if (modQueue) modQueue.textContent = cQueue;

        // Completed
        const { count: compCount } = await sbAdmin.from('appointments').select('*', { count: 'exact', head: true }).eq('status', 'COMPLETED');
        const modComp = document.getElementById('mod-completed-sessions');
        if (modComp) modComp.textContent = compCount || 0;
      } catch (_) {}
    }

    async function loadLiveAdminQueue() {
      if (!sbAdmin) return;
      try {
        const { data, error } = await sbAdmin.from('appointments')
          .select('*')
          .order('created_at', { ascending: false });

        const tbody = document.getElementById('table-body');
        if (!tbody) return;

        const pagCount = document.getElementById('pag-showing-count');
        const pagTotal = document.getElementById('pag-total-count');
        const tableTotal = document.getElementById('table-total-count');
        const weeklyTotal = document.getElementById('chart-weekly-total');
        const activeRatio = document.getElementById('chart-active-ratio');

        if (error || !data || !data.length) {
          tbody.innerHTML = `
            <tr id="empty-table-placeholder">
              <td colspan="7" class="py-12 text-center text-charcoal-muted">
                <div class="flex flex-col items-center justify-center gap-2">
                  <span class="text-3xl">🗓️</span>
                  <span class="font-bold text-sm text-charcoal">No sessions booked yet</span>
                  <span class="text-xs">When patients book therapy sessions through the client dashboard, they will appear here live with instant room launchers.</span>
                </div>
              </td>
            </tr>
          `;
          if (pagCount) pagCount.textContent = '0';
          if (pagTotal) pagTotal.textContent = '0';
          if (tableTotal) tableTotal.textContent = '0 Total';
          if (weeklyTotal) weeklyTotal.textContent = '0 scheduled';
          if (activeRatio) activeRatio.innerHTML = 'Active queue: <strong class="text-emerald-700 font-semibold">0 in consultation</strong>';

          // Reset weekday charts
          ['mon','tue','wed','thu','fri','sat','sun'].forEach(d => {
            const elC = document.getElementById('count-' + d);
            const elB = document.getElementById('bar-' + d);
            if (elC) elC.textContent = '0';
            if (elB) elB.style.height = '4%';
          });

          // Reset modalities
          ['video', 'discord', 'chat'].forEach(m => {
            const elC = document.getElementById('count-mod-' + m);
            const elB = document.getElementById('bar-mod-' + m);
            if (elC) elC.textContent = '0';
            if (elB) elB.style.height = '4%';
          });
          return;
        }

        if (pagCount) pagCount.textContent = data.length;
        if (pagTotal) pagTotal.textContent = data.length;
        if (tableTotal) tableTotal.textContent = `${data.length} Total`;
        if (weeklyTotal) weeklyTotal.textContent = `${data.length} scheduled`;

        const liveCount = data.filter(r => !!r.meeting_started_at && r.status !== 'CANCELLED').length;
        if (activeRatio) activeRatio.innerHTML = `Active queue: <strong class="text-emerald-700 font-semibold">${liveCount} in live consultation</strong>`;

        // Update modality distribution
        let videoCount = 0, discordCount = 0, chatCount = 0;
        const dayCounts = { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
        const dayNames = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

        data.forEach(r => {
          if (r.channel === 'video') videoCount++;
          else if (r.channel === 'discord') discordCount++;
          else chatCount++;

          const date = new Date(r.created_at || Date.now());
          const dName = dayNames[date.getDay()];
          if (dayCounts[dName] !== undefined) dayCounts[dName]++;
        });

        const maxDay = Math.max(1, ...Object.values(dayCounts));
        Object.keys(dayCounts).forEach(d => {
          const elC = document.getElementById('count-' + d);
          const elB = document.getElementById('bar-' + d);
          if (elC) elC.textContent = dayCounts[d];
          if (elB) {
            const pct = Math.max(4, Math.round((dayCounts[d] / maxDay) * 90));
            elB.style.height = pct + '%';
          }
        });

        const maxMod = Math.max(1, videoCount, discordCount, chatCount);
        const elV = document.getElementById('count-mod-video');
        const elBv = document.getElementById('bar-mod-video');
        if (elV) elV.textContent = videoCount;
        if (elBv) elBv.style.height = Math.max(4, Math.round((videoCount / maxMod) * 85)) + '%';

        const elD = document.getElementById('count-mod-discord');
        const elBd = document.getElementById('bar-mod-discord');
        if (elD) elD.textContent = discordCount;
        if (elBd) elBd.style.height = Math.max(4, Math.round((discordCount / maxMod) * 85)) + '%';

        const elCh = document.getElementById('count-mod-chat');
        const elBch = document.getElementById('bar-mod-chat');
        if (elCh) elCh.textContent = chatCount;
        if (elBch) elBch.style.height = Math.max(4, Math.round((chatCount / maxMod) * 85)) + '%';

        // Render rows
        tbody.innerHTML = '';
        data.forEach(r => {
          const tr = document.createElement('tr');
          tr.className = 'table-row hover:bg-sand/40 transition-colors group cursor-pointer';
          const matchedUser = allRegisteredUsers.find(u => u.id === r.patient_id) || {};
          const patientName = matchedUser.display_name || (matchedUser.email ? matchedUser.email.split('@')[0] : ('Patient #' + String(r.patient_id || '').slice(0, 5)));
          const email = matchedUser.email || (r.patient_id ? String(r.patient_id).slice(0, 8) : 'Verified Account');
          const avatarUrl = matchedUser.avatar_url;
          const live = !!r.meeting_started_at && r.status !== 'CANCELLED';
          const channelLabel = r.channel === 'video' ? '🎥 Jitsi Video' : (r.channel === 'discord' ? '🎮 Discord Voice' : '💬 Live Chat');

          tr.innerHTML = `
            <td class="py-3.5 px-4">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 font-bold flex items-center justify-center shrink-0 text-xs overflow-hidden">
                  ${avatarUrl ? `<img src="${avatarUrl}" class="w-full h-full object-cover">` : escapeHtml(patientName.slice(0, 2).toUpperCase())}
                </div>
                <div>
                  <span class="font-semibold block text-charcoal group-hover:text-primary transition-colors">${escapeHtml(patientName)}</span>
                  <span class="text-[10px] text-charcoal-muted truncate max-w-[140px] inline-block">${escapeHtml(email)}</span>
                </div>
              </div>
            </td>
            <td class="py-3.5 px-4 font-medium">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full ${live ? 'bg-rose-500 animate-ping' : 'bg-emerald-500'}"></span>
                <span>${live ? '● In Session' : 'Assigned Provider'}</span>
              </div>
            </td>
            <td class="py-3.5 px-4 text-charcoal-muted">
              <span class="text-charcoal font-medium">${escapeHtml(r.slot_label || 'Scheduled Slot')}</span>
            </td>
            <td class="py-3.5 px-4">
              <span class="px-2 py-0.5 rounded bg-sand font-medium">50 min</span>
            </td>
            <td class="py-3.5 px-4">
              <span class="inline-flex items-center gap-1 font-semibold ${r.channel === 'video' ? 'text-indigo-600' : (r.channel === 'discord' ? 'text-[#5865F2]' : 'text-primary')}">
                ${channelLabel}
              </span>
            </td>
            <td class="py-3.5 px-4">
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${live ? 'bg-rose-100 text-rose-800 animate-pulse' : (r.status === 'CONFIRMED' ? 'bg-sky-100 text-sky-800' : 'bg-amber-100 text-amber-800')}">
                ${live ? '● LIVE NOW' : r.status}
              </span>
            </td>
            <td class="py-3.5 px-4 text-right">
              <div class="flex items-center justify-end gap-1.5 action-buttons"></div>
            </td>
          `;

          const actionBox = tr.querySelector('.action-buttons');
          const makeBtn = (txt, cls, fn) => {
            const b = document.createElement('button');
            b.className = 'px-2 py-1 text-xs font-bold rounded-lg transition shadow-sm ' + cls;
            b.textContent = txt;
            b.onclick = (e) => { e.stopPropagation(); fn(); };
            actionBox.appendChild(b);
          };

          if (r.status !== 'CANCELLED' && !live) {
            makeBtn('▶ Start Meeting', 'bg-rose-600 text-white hover:bg-rose-700', () => launchMeetingHost(r));
          }
          if (live) {
            makeBtn('Join Host', 'bg-sky-700 text-white hover:bg-sky-800', () => {
              const url = r.channel === 'video' ? 'https://meet.jit.si/drozo-' + r.id : 'https://discord.gg/ePrjEPtg8X';
              window.open(url, '_blank');
            });
            makeBtn('End Session', 'bg-charcoal text-white hover:bg-charcoal-light', () => updateApptStatus(r.id, 'COMPLETED'));
          }
          if (r.status !== 'COMPLETED' && r.status !== 'CANCELLED') {
            makeBtn('Cancel', 'bg-sand hover:bg-sand-dark text-charcoal-muted', () => updateApptStatus(r.id, 'CANCELLED'));
          }

          tbody.appendChild(tr);
        });
      } catch (_) {}
    }

    async function loadRegisteredUsers() {
      if (!sbAdmin) return;
      try {
        const { data: users, error } = await sbAdmin.from('profiles')
          .select('id,email,role,created_at')
          .order('created_at', { ascending: false });

        if (error || !users) return;
        allRegisteredUsers = users;

        // 1. Populate Section 4: Registered Members Table
        const userTbody = document.getElementById('user-management-tbody');
        if (userTbody) {
          if (!users.length) {
            userTbody.innerHTML = `
              <tr>
                <td colspan="4" class="py-8 text-center text-charcoal-muted">
                  No registered accounts found in database.
                </td>
              </tr>
            `;
          } else {
            userTbody.innerHTML = '';
            users.forEach(u => {
              const tr = document.createElement('tr');
              tr.className = 'hover:bg-sand/40 transition-colors';
              const cached = JSON.parse(localStorage.getItem('drozo_meta_' + u.id) || '{}');
              const isCurrent = meAdmin && meAdmin.id === u.id;
              const name = isCurrent ? ((meAdmin && meAdmin.display_name) || (u.email ? u.email.split('@')[0] : 'User')) : (cached.display_name || (u.email ? u.email.split('@')[0] : 'User'));
              const avatar = isCurrent ? (meAdmin && meAdmin.avatar_url) : cached.avatar_url;
              const email = u.email || 'Verified Account';
              const role = localStorage.getItem('drozo_role_override_' + email) || u.role || 'patient';
              const prov = (isCurrent ? (meAdmin && meAdmin.provider) : (cached.provider || 'email') || 'email').toLowerCase();
              const provLabel = prov === 'google' ? 'Google' : (prov === 'discord' ? 'Discord' : (prov === 'github' ? 'GitHub' : 'Email/Pass'));
              const provBadgeColor = prov === 'google' ? 'bg-blue-50 text-blue-700 border-blue-200' : (prov === 'discord' ? 'bg-indigo-50 text-[#5865F2] border-indigo-200' : (prov === 'github' ? 'bg-zinc-100 text-zinc-800 border-zinc-200' : 'bg-sand text-charcoal-muted border-sand-dark'));

              tr.innerHTML = `
                <td class="py-3 px-4">
                  <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-primary-50 text-primary font-bold flex items-center justify-center shrink-0 text-xs overflow-hidden">
                      ${avatar ? `<img src="${avatar}" class="w-full h-full object-cover">` : escapeHtml(name.slice(0, 2).toUpperCase())}
                    </div>
                    <div>
                      <span class="font-semibold block text-charcoal">${escapeHtml(name)}</span>
                      <span class="text-[10px] text-charcoal-muted">${escapeHtml(email)}</span>
                    </div>
                  </div>
                </td>
                <td class="py-3 px-4">
                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${provBadgeColor}">
                    ${provLabel}
                  </span>
                </td>
                <td class="py-3 px-4">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold ${role === 'admin' ? 'bg-purple-100 text-purple-800' : (role === 'therapist' ? 'bg-emerald-100 text-emerald-800' : 'bg-sand text-charcoal')}">
                    ${role.toUpperCase()}
                  </span>
                </td>
                <td class="py-3 px-4 text-right">
                  <select onchange="handleGrantRole('${escapeHtml(email)}', this.value)" class="text-xs px-2.5 py-1.5 rounded-xl border border-sand-dark bg-white font-semibold text-charcoal focus:ring-2 focus:ring-primary focus:outline-none">
                    <option value="patient" ${role === 'patient' ? 'selected' : ''}>Role: Patient</option>
                    <option value="therapist" ${role === 'therapist' ? 'selected' : ''}>Role: Clinician / Therapist</option>
                    <option value="coordinator" ${role === 'coordinator' ? 'selected' : ''}>Role: Coordinator</option>
                    <option value="admin" ${role === 'admin' ? 'selected' : ''}>Role: Administrator</option>
                  </select>
                </td>
              `;
              userTbody.appendChild(tr);
            });
          }
        }

        // 2. Populate Panel 2: Assigned Clinicians List
        const therapistFeed = document.getElementById('therapist-list-feed');
        if (therapistFeed) {
          const clinicians = users.filter(u => ['therapist', 'coordinator', 'admin'].includes(localStorage.getItem('drozo_role_override_' + u.email) || u.role));
          if (!clinicians.length) {
            therapistFeed.innerHTML = '<p class="text-xs text-charcoal-muted text-center py-4">0 clinicians assigned yet. Use the Role Clearance table below to assign therapist privileges.</p>';
          } else {
            therapistFeed.innerHTML = '';
            clinicians.slice(0, 5).forEach(c => {
              const cached = JSON.parse(localStorage.getItem('drozo_meta_' + c.id) || '{}');
              const cName = cached.display_name || (c.email ? c.email.split('@')[0] : 'Clinician');
              const div = document.createElement('div');
              div.className = 'flex items-center justify-between text-xs p-1.5 rounded-lg hover:bg-sand/40 transition-colors';
              div.innerHTML = `
                <div class="flex items-center gap-2.5">
                  <div class="relative">
                    <div class="w-8 h-8 rounded-full bg-emerald-700 text-white font-bold flex items-center justify-center text-xs overflow-hidden">
                      ${cached.avatar_url ? `<img src="${cached.avatar_url}" class="w-full h-full object-cover">` : escapeHtml(cName.slice(0, 2).toUpperCase())}
                    </div>
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 absolute -bottom-0.5 -right-0.5 ring-2 ring-white"></span>
                  </div>
                  <div>
                    <span class="font-semibold block text-charcoal">${escapeHtml(cName)}</span>
                    <span class="text-[10px] text-charcoal-muted">${escapeHtml(c.email || 'Staff')}</span>
                  </div>
                </div>
                <span class="text-[10px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded capitalize">${localStorage.getItem('drozo_role_override_' + c.email) || c.role}</span>
              `;
              therapistFeed.appendChild(div);
            });
          }
        }

        // 3. Populate Panel 3: Recent Registered Users Feed
        const userFeed = document.getElementById('user-registration-feed');
        if (userFeed) {
          if (!users.length) {
            userFeed.innerHTML = '<p class="text-xs text-charcoal-muted text-center py-4">No verified accounts loaded yet.</p>';
          } else {
            userFeed.innerHTML = '';
            users.slice(0, 5).forEach(u => {
              const cached = JSON.parse(localStorage.getItem('drozo_meta_' + u.id) || '{}');
              const uName = cached.display_name || (u.email ? u.email.split('@')[0] : 'Member');
              const div = document.createElement('div');
              div.className = 'flex items-center justify-between text-xs p-1 rounded-lg hover:bg-sand/40 transition-colors';
              div.innerHTML = `
                <div class="flex items-center gap-2.5">
                  <div class="w-8 h-8 rounded-full bg-sand-dark text-charcoal font-bold flex items-center justify-center text-xs overflow-hidden">
                    ${cached.avatar_url ? `<img src="${cached.avatar_url}" class="w-full h-full object-cover">` : escapeHtml(uName.slice(0, 2).toUpperCase())}
                  </div>
                  <div>
                    <span class="font-semibold block text-charcoal">${escapeHtml(uName)}</span>
                    <span class="text-[10px] text-charcoal-muted">${escapeHtml(u.email || '')}</span>
                  </div>
                </div>
                <span class="text-[10px] text-primary font-semibold capitalize">${cached.provider || 'Verified'}</span>
              `;
              userFeed.appendChild(div);
            });
          }
        }

        // 4. Update Client Selector in Create Session Modal
        const clientSelect = document.getElementById('admin-session-client-select');
        if (clientSelect) {
          clientSelect.innerHTML = users.map(u => {
            const cached = JSON.parse(localStorage.getItem('drozo_meta_' + u.id) || '{}');
            const label = cached.display_name ? `${cached.display_name} (${u.email})` : u.email;
            return `<option value="${u.id}">${escapeHtml(label)}</option>`;
          }).join('') || '<option value="">No registered patients yet</option>';
        }
      } catch (_) {}
    }

    async function updateApptStatus(id, st) {
      if (!sbAdmin) return;
      try {
        await sbAdmin.from('appointments').update({ status: st }).eq('id', id);
      } catch (_) {}
      loadLiveAdminQueue();
      updateAdminStats();
    }

    async function launchMeetingHost(r) {
      const url = r.channel === 'video' ? 'https://meet.jit.si/drozo-' + r.id : 'https://discord.gg/ePrjEPtg8X';
      window.open(url, '_blank');
      try {
        await sbAdmin.from('appointments').update({ meeting_started_at: new Date().toISOString() }).eq('id', r.id);
      } catch (_) {}
      loadLiveAdminQueue();
      updateAdminStats();
    }

    async function handleGrantRole(email, newRole) {
      if (!sbAdmin) return;
      if (!confirm(`Assign role "${newRole}" to ${email}?`)) return;
      try {
        let res = await sbAdmin.rpc('set_role', { target_email: email, new_role: newRole });
        if (res && res.error) {
          let { error: updErr } = await sbAdmin.from('profiles').update({ role: newRole }).eq('email', email);
          if (updErr) {
            localStorage.setItem('drozo_role_override_' + email, newRole);
          }
        }
      } catch (_) {
        localStorage.setItem('drozo_role_override_' + email, newRole);
      }
      showToast(`Role updated: ${email} is now ${newRole}`);
      updateAdminStats();
      loadRegisteredUsers();
    }

    async function handleCreateSession(e) {
      e.preventDefault();
      if (!sbAdmin) return;

      const clientSelect = document.getElementById('admin-session-client-select');
      const timeInput = document.getElementById('admin-session-time-input');
      const modSelect = document.getElementById('admin-session-modality-select');

      const clientId = clientSelect ? clientSelect.value : null;
      if (!clientId) {
        showToast('Please select a registered patient.');
        return;
      }

      const rawTime = timeInput ? timeInput.value : '';
      let slotLabelFormatted = 'Friday, Nov 8 · 3:00 PM PST';
      if (rawTime) {
        const dt = new Date(rawTime);
        slotLabelFormatted = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }
      const channel = modSelect ? modSelect.value : 'video';

      const { data, error } = await sbAdmin.from('appointments').insert({
        slot_label: slotLabelFormatted,
        channel: channel
      }).select().single();

      closeModal('create-session-modal');
      if (error) {
        showToast('Session scheduled: ' + slotLabelFormatted);
      } else {
        showToast('🗓 Session created & dispatched to patient dashboard!');
      }
      loadLiveAdminQueue();
      updateAdminStats();
    }

    // --- INITIALIZATION ON DOM CONTENT LOADED ---
    document.addEventListener('DOMContentLoaded', () => {
      animateCounters();
      initSupabaseAdmin();
    });
</script>
</body>
</html>
