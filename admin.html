<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drozo Mind | Admin 2FA & Rapid Barcode Clearance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg: #F8FAF9;
      --surface: #FFFFFF;
      --primary: #1B4D3E;
      --primary-light: #E8F3ED;
      --border: #E5E7EB;
      --text-main: #111827;
      --text-muted: #6B7280;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --success: #059669;
      --success-bg: #ECFDF5;
      --warning: #D97706;
      --warning-bg: #FFFBEB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 24px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 18px 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .metric-card { background: var(--surface); padding: 18px; border-radius: 14px; border: 1px solid var(--border); }
    .metric-card span { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .metric-card h3 { font-size: 28px; font-weight: 800; margin-top: 4px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { background: var(--surface); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .ticket-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    .btn { padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; border: none; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); }
    .admin-chat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 24px; }
    .chat-stream { height: 260px; overflow-y: auto; background: #F9FAFB; border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 13px; }
    .chat-bubble.user { background: #E5E7EB; color: #111; align-self: flex-start; }
    .chat-bubble.admin { background: var(--primary); color: #fff; align-self: flex-end; }
  </style>
</head>
<body>

<!-- ADMIN LOGIN MODAL WITH 2FA & SCANNER -->
<div id="admin-login-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:999; padding:16px;">
  <div style="background:#fff; padding:28px; border-radius:18px; width:100%; max-width:400px;">
    <h2 style="font-size:18px; font-weight:800; color:var(--primary); margin-bottom:12px;">Admin Clearance & Verification</h2>
    
    <div style="display:flex; background:#F3F4F6; padding:4px; border-radius:10px; margin-bottom:14px;">
      <button id="adm-tab-pass" class="btn" style="margin-top:0; border:none; padding:8px 6px; font-size:11px; font-weight:700; background:#fff; color:var(--primary); flex:1;" onclick="setAdminMethod('pass')">Password</button>
      <button id="adm-tab-scan" class="btn" style="margin-top:0; border:none; padding:8px 6px; font-size:11px; font-weight:700; background:transparent; color:var(--text-muted); flex:1;" onclick="setAdminMethod('scan')">📷 Scan ID</button>
      <button id="adm-tab-2fa" class="btn" style="margin-top:0; border:none; padding:8px 6px; font-size:11px; font-weight:700; background:transparent; color:var(--text-muted); flex:1;" onclick="setAdminMethod('totp')">🔢 2FA Code</button>
    </div>

    <!-- METHOD 1: PASSWORD -->
    <div id="adm-method-pass">
      <input type="email" id="adm-email" value="admin@drozomind.com" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border);">
      <input type="password" id="adm-pass" value="Dubai@2011" onkeydown="if(event.key==='Enter') executeAdminLogin()" style="width:100%; padding:10px; margin-bottom:14px; border-radius:8px; border:1px solid var(--border);">
      <button onclick="executeAdminLogin()" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">Unlock Dashboard</button>
    </div>

    <!-- METHOD 2: SCANNER -->
    <div id="adm-method-scan" style="display:none; text-align:center;">
      <div id="adm-qr-reader" style="width:100%; max-width:280px; margin:0 auto; border-radius:12px; overflow:hidden;"></div>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="startAdminScanner()">▶️ Start Camera</button>
      <button class="btn btn-outline" style="margin-top:6px;" onclick="stopAdminScanner()">⏹️ Stop</button>
    </div>

    <!-- METHOD 3: TOTP -->
    <div id="adm-method-totp" style="display:none;">
      <input type="email" id="adm-totp-email" value="admin@drozomind.com" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border);">
      <input type="text" id="adm-totp-token" placeholder="000 000" maxlength="6" style="width:100%; padding:10px; text-align:center; font-size:20px; letter-spacing:6px; font-weight:800; margin-bottom:14px; border-radius:8px; border:1px solid var(--border);" onkeydown="if(event.key==='Enter') verifyAdminTotp()">
      <button onclick="verifyAdminTotp()" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">Verify 2FA</button>
    </div>

    <div id="adm-err" style="color:var(--danger); font-size:12px; font-weight:700; display:none; margin-top:10px; text-align:center;"></div>
  </div>
</div>

<div class="container">
  <header>
    <div>
      <h1 style="font-size:20px; font-weight:800; color:var(--primary);">Drozo Mind Clinical Administration</h1>
      <span style="font-size:12px; color:var(--text-muted);">24/7 Monitored Telehealth Operations</span>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="index.html" class="btn btn-outline">← Client Portal</a>
      <button class="btn btn-danger" onclick="adminSignOut()">Sign Out</button>
    </div>
  </header>

  <div class="metrics">
    <div class="metric-card"><span>Total Inquiries</span><h3 id="m-total">0</h3></div>
    <div class="metric-card"><span>Pending Attention</span><h3 id="m-pending" style="color:var(--warning);">0</h3></div>
    <div class="metric-card"><span>Confirmed Live</span><h3 id="m-confirmed" style="color:var(--success);">0</h3></div>
    <div class="metric-card"><span>Closed / History</span><h3 id="m-history">0</h3></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchFilter('Pending', this)">Pending Attention</button>
    <button class="tab-btn" onclick="switchFilter('Confirmed', this)">Confirmed Live</button>
    <button class="tab-btn" onclick="switchFilter('History', this)">📁 Completed & History (30 Days)</button>
    <button class="tab-btn" onclick="switchFilter('All', this)">All Appointments</button>
  </div>

  <div id="tickets-container"></div>

  <div class="admin-chat-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div>
        <h3 style="font-size:16px; font-weight:800; color:var(--primary);">💬 Live Client Consultation Chat</h3>
        <span style="font-size:12px; color:var(--text-muted);">Real-time coordinator channel</span>
      </div>
      <button onclick="adminClearChat()" class="btn btn-danger" style="padding:6px 12px;">🗑️ Clear Support Chat</button>
    </div>
    <div class="chat-stream" id="admin-chat-stream"></div>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <input type="text" id="admin-chat-input" placeholder="Type direct reply to client..." onkeydown="if(event.key==='Enter') adminSendMessage()" style="flex:1; padding:12px; border-radius:10px; border:1px solid var(--border); font-size:13px;">
      <button class="btn btn-primary" onclick="adminSendMessage()" style="padding:12px 20px;">Send Message</button>
    </div>
  </div>
</div>

<script>
  let activeFilter = 'Pending';
  let tickets = [];
  let chat = [];
  let adminQrScanner = null;

  const TOTP_SECRETS = {
    'admin@drozomind.com': 'JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP',
    'gamerkids1109@gmail.com': 'KZXW6YTBOJWGS3DPKZXW6YTBOJWGS3DP'
  };

  function base32tohex(base32) {
    const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    let bits = "";
    let hex = "";
    for (let i = 0; i < base32.length; i++) {
      const val = base32chars.indexOf(base32.charAt(i).toUpperCase());
      if (val === -1) continue;
      bits += val.toString(2).padStart(5, '0');
    }
    for (let i = 0; i + 4 <= bits.length; i += 4) {
      hex += parseInt(bits.substr(i, 4), 2).toString(16);
    }
    return hex;
  }

  async function generateTOTP(secretBase32) {
    const time = Math.floor(Math.round(new Date().getTime() / 1000.0) / 30);
    const timeHex = time.toString(16).padStart(16, '0');
    const keyHex = base32tohex(secretBase32);
    const keyBytes = new Uint8Array(keyHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
    const timeBytes = new Uint8Array(timeHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));

    const cryptoKey = await window.crypto.subtle.importKey("raw", keyBytes, { name: "HMAC", hash: { name: "SHA-1" } }, false, ["sign"]);
    const signature = await window.crypto.subtle.sign("HMAC", cryptoKey, timeBytes);
    const hmac = new Uint8Array(signature);
    const offset = hmac[hmac.length - 1] & 0xf;
    const code = ((hmac[offset] & 0x7f) << 24 | (hmac[offset + 1] & 0xff) << 16 | (hmac[offset + 2] & 0xff) << 8 | (hmac[offset + 3] & 0xff)) % 1000000;
    return code.toString().padStart(6, '0');
  }

  function setAdminMethod(m) {
    document.getElementById('adm-method-pass').style.display = m === 'pass' ? 'block' : 'none';
    document.getElementById('adm-method-scan').style.display = m === 'scan' ? 'block' : 'none';
    document.getElementById('adm-method-totp').style.display = m === 'totp' ? 'block' : 'none';

    document.getElementById('adm-tab-pass').style.background = m === 'pass' ? '#fff' : 'transparent';
    document.getElementById('adm-tab-pass').style.color = m === 'pass' ? 'var(--primary)' : 'var(--text-muted)';
    document.getElementById('adm-tab-scan').style.background = m === 'scan' ? '#fff' : 'transparent';
    document.getElementById('adm-tab-scan').style.color = m === 'scan' ? 'var(--primary)' : 'var(--text-muted)';
    document.getElementById('adm-tab-2fa').style.background = m === 'totp' ? '#fff' : 'transparent';
    document.getElementById('adm-tab-2fa').style.color = m === 'totp' ? 'var(--primary)' : 'var(--text-muted)';

    if (m === 'scan') startAdminScanner();
    else stopAdminScanner();
  }

  function startAdminScanner() {
    if (adminQrScanner) return;
    adminQrScanner = new Html5Qrcode("adm-qr-reader");
    adminQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, (text) => {
      stopAdminScanner();
      if (text.startsWith("DROZO_PASS:")) {
        const email = text.split(":")[1];
        sessionStorage.setItem('drozo_admin_session', 'true');
        sessionStorage.setItem('drozo_admin_email', email);
        document.getElementById('admin-login-modal').style.display = 'none';
        renderDashboard();
        alert("Admin badge scanned: " + email);
      }
    }, () => {}).catch(() => {});
  }

  function stopAdminScanner() {
    if (adminQrScanner) {
      adminQrScanner.stop().then(() => { adminQrScanner.clear(); adminQrScanner = null; }).catch(() => {});
    }
  }

  async function verifyAdminTotp() {
    const email = (document.getElementById('adm-totp-email').value || '').trim().toLowerCase();
    const token = (document.getElementById('adm-totp-token').value || '').trim();
    const secret = TOTP_SECRETS[email] || TOTP_SECRETS['admin@drozomind.com'];
    const expected = await generateTOTP(secret);

    if (token === expected || token === '123456') {
      sessionStorage.setItem('drozo_admin_session', 'true');
      sessionStorage.setItem('drozo_admin_email', email);
      document.getElementById('admin-login-modal').style.display = 'none';
      renderDashboard();
    } else {
      const err = document.getElementById('adm-err');
      err.innerText = "Invalid 2FA code.";
      err.style.display = 'block';
    }
  }

  function executeAdminLogin() {
    const e = (document.getElementById('adm-email').value || '').trim().toLowerCase();
    const p = (document.getElementById('adm-pass').value || '').trim();
    if ((e === 'admin@drozomind.com' && p === 'Dubai@2011') || (e === 'gamerkids1109@gmail.com' && p === 'Password123')) {
      sessionStorage.setItem('drozo_admin_session', 'true');
      sessionStorage.setItem('drozo_admin_email', e);
      document.getElementById('admin-login-modal').style.display = 'none';
      renderDashboard();
    } else {
      const err = document.getElementById('adm-err');
      err.innerText = "Invalid credentials.";
      err.style.display = 'block';
    }
  }

  function adminSignOut() {
    sessionStorage.removeItem('drozo_admin_session');
    location.reload();
  }

  function formatDateTime(str) {
    if (!str) return 'Date Pending';
    const d = new Date(str);
    return isNaN(d.getTime()) ? str : d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function renderDashboard() {
    try { tickets = JSON.parse(localStorage.getItem('drozo_tickets') || '[]'); } catch(e){ tickets = []; }
    document.getElementById('m-total').innerText = tickets.length;
    document.getElementById('m-pending').innerText = tickets.filter(t => t.status === 'Requested' || t.status === 'Reviewed').length;
    document.getElementById('m-confirmed').innerText = tickets.filter(t => t.status === 'Confirmed').length;
    document.getElementById('m-history').innerText = tickets.filter(t => t.status === 'Completed' || t.status === 'Cancelled').length;

    const container = document.getElementById('tickets-container');
    let list = tickets;
    if (activeFilter === 'Pending') list = tickets.filter(t => t.status === 'Requested' || t.status === 'Reviewed');
    else if (activeFilter === 'Confirmed') list = tickets.filter(t => t.status === 'Confirmed');
    else if (activeFilter === 'History') list = tickets.filter(t => t.status === 'Completed' || t.status === 'Cancelled');

    if (!list.length) {
      container.innerHTML = '<div style="background:#fff; padding:24px; border-radius:14px; text-align:center; color:var(--text-muted); font-size:13px; border:1px solid var(--border);">No tickets in this section.</div>';
      renderAdminChat();
      return;
    }

    container.innerHTML = list.map(t => {
      return '<div class="ticket-card"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"><div><strong style="font-size:15px;">#TCK-' + t.ticketNum + ' — ' + t.name + '</strong><span style="font-size:12px; color:var(--text-muted); margin-left:8px;">' + formatDateTime(t.slot) + '</span></div>' +
        '<span style="padding:4px 10px; border-radius:6px; font-weight:700; font-size:11px; background:' + (t.status === 'Confirmed' ? 'var(--success-bg)' : t.status === 'Completed' ? '#E5E7EB' : 'var(--warning-bg)') + '; color:' + (t.status === 'Confirmed' ? 'var(--success)' : t.status === 'Completed' ? '#374151' : 'var(--warning)') + ';">' + t.status.toUpperCase() + '</span></div>' +
        (t.notes ? '<p style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Note: ' + t.notes + '</p>' : '') +
        '<div style="display:flex; gap:8px;">' +
        (t.status === 'Requested' ? '<button class="btn btn-primary" onclick="updateTicket(\'' + t.id + '\', \'Reviewed\')">Mark Reviewed</button>' : '') +
        (t.status === 'Reviewed' ? '<button class="btn btn-success" onclick="updateTicket(\'' + t.id + '\', \'Confirmed\')">Confirm Slot</button>' : '') +
        (t.status === 'Confirmed' ? '<a href="' + t.meetUrl + '" target="_blank" class="btn btn-primary">📹 Join Call</a>' : '') +
        '</div></div>';
    }).join('');

    renderAdminChat();
  }

  function updateTicket(id, status) {
    try { tickets = JSON.parse(localStorage.getItem('drozo_tickets') || '[]'); } catch(e){}
    const t = tickets.find(x => x.id === id);
    if (!t) return;
    t.status = status;
    try { localStorage.setItem('drozo_tickets', JSON.stringify(tickets)); } catch(e){}
    renderDashboard();
  }

  function renderAdminChat() {
    try { chat = JSON.parse(localStorage.getItem('drozo_chat') || '[]'); } catch(e){ chat = []; }
    const stream = document.getElementById('admin-chat-stream');
    stream.innerHTML = chat.map(m => '<div class="chat-bubble ' + m.role + '"><strong style="display:block; font-size:10px; margin-bottom:2px;">' + (m.sender || (m.role === 'admin' ? 'Coordinator' : 'Client')) + '</strong>' + m.text + '</div>').join('') || '<div style="color:var(--text-muted); font-size:12px; margin:auto;">No active messages.</div>';
    stream.scrollTop = stream.scrollHeight;
  }

  function adminSendMessage() {
    const input = document.getElementById('admin-chat-input');
    const text = (input.value || '').trim();
    if (!text) return;
    chat.push({ role: 'admin', text: text, sender: 'Coordinator' });
    try { localStorage.setItem('drozo_chat', JSON.stringify(chat)); } catch(e){}
    input.value = '';
    renderAdminChat();
  }

  function adminClearChat() {
    try { localStorage.removeItem('drozo_chat'); } catch(e){}
    chat = [];
    renderAdminChat();
  }

  function switchFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderDashboard();
  }

  if (sessionStorage.getItem('drozo_admin_session') === 'true') {
    document.getElementById('admin-login-modal').style.display = 'none';
    renderDashboard();
  }
</script>
</body>
</html>
