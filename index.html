<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drozo Guard - Device Pairing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #060b13; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center space-y-5">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30">
      <span>🔗</span> Step 1: Link Device
    </div>
    
    <div>
      <h2 class="text-xl font-bold text-white">Pair Drozo Guard APK</h2>
      <p class="text-xs text-slate-400 mt-1">Tap <strong class="text-blue-400">Pair with Drozo Portal</strong> on your phone and scan below.</p>
    </div>

    <div class="flex justify-center py-2">
      <div class="bg-white p-4 rounded-2xl shadow-xl">
        <!-- Exact DROZO_GUARD_LINK payload required by MainActivity.kt -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=DROZO_GUARD_LINK:admin@drozominds.com:INIT_SEC_8829" alt="Pairing QR" class="w-48 h-48" />
      </div>
    </div>

    <div class="text-xs mono text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800/80">
      Payload: <span class="text-blue-400 font-semibold">DROZO_GUARD_LINK</span><br/>
      Target: <span class="text-emerald-400 font-semibold">admin@drozominds.com</span>
    </div>

    <div class="pt-2">
      <a href="./auth.html" class="inline-block px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow transition">
        Already Paired? Go to Login Scan →
      </a>
    </div>
  </div>

</body>
</html>
